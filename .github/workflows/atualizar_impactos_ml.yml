name: Atualizar Dados - Impactos ML

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar Processamento do CSV
      run: python gerar_impactos_ml.py

    - name: Commitar e Salvar Atualizações
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add impactos_ml.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "bot: Atualização automática dos dados da aba Impactos ML" && git push)
